  --serif:"Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
  --sans:"Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.05;text-wrap:balance;margin:0;color:var(--ink)}
h2{font-size:clamp(2rem,4vw,2.8rem)}
em{font-style:italic}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);font-weight:600}
.eyebrow::before{content:"";width:18px;height:8px;border-radius:4px;background:var(--lime);border:1px solid var(--black)}
.center .eyebrow{justify-content:center}
.center{text-align:center}
.sub{color:var(--muted);margin:8px 0 0}
section{padding-block:clamp(52px,7vw,84px)}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:500 .95rem var(--sans);padding:.8rem 1.4rem;border-radius:6px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.btn-lime{background:var(--lime);color:var(--black);border-color:var(--black)}
.btn-lime:hover{background:var(--black);color:var(--lime)}
.btn-line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--white)}
.arrow::after{content:"→"}

/* Faixa de cupom e cabeçalho */
.promo{background:var(--black);color:var(--white);text-align:center;font-size:.85rem;padding:8px 16px;letter-spacing:.02em}
.promo b{letter-spacing:.06em;color:var(--lime)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgb(250 250 245 / .94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{font-family:var(--serif);font-size:1.75rem;letter-spacing:.08em;text-decoration:none;text-transform:uppercase;font-weight:500;white-space:nowrap}
.nav{display:flex;gap:26px;font-size:.92rem}
.nav a{text-decoration:none;padding-bottom:3px;border-bottom:1px solid transparent}
.nav a:hover{border-color:var(--ink)}
.icons{display:flex;align-items:center;gap:14px}
.icon-btn{position:relative;background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);display:inline-flex}
.icon-btn svg{width:22px;height:22px}
.bag-count{position:absolute;top:-2px;right:-4px;background:var(--lime);color:var(--black);border:1px solid var(--black);border-radius:999px;min-width:18px;height:18px;font-size:.7rem;line-height:18px;text-align:center;padding:0 4px}
@media (max-width:820px){.nav{display:none}}

/* Logomarca */
.mark{display:inline-block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;aspect-ratio:224/275}
.logo-tile{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:11px;background:radial-gradient(circle at 50% 45%, var(--lime), #EAFDA0 75%);color:var(--black);flex:none;border:1px solid rgb(17 17 17 / .12)}
.logo-tile .mark{height:62%}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.seal{position:absolute;left:-10px;bottom:16%;width:96px;height:96px;border-radius:50%;background:var(--lime);border:1.5px solid var(--black);display:grid;place-items:center;color:var(--black);box-shadow:0 10px 24px rgb(17 17 17 / .18)}
.seal .mark{height:46px}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.life-art .big-mark{position:absolute;right:10%;top:9%;height:32%;color:var(--lime);opacity:.95}
@media (max-width:860px){.seal{left:0}}

/* Vitrine animada (efeito da referência em vídeo): peça grande flutuando, fundo que muda de cor, troca com deslize */
.stack{position:absolute;left:12%;right:12%;bottom:8%;display:grid;gap:0}
.fold{height:62px;border-radius:14px;margin-top:-14px;box-shadow:0 6px 14px rgb(17 17 17 / .18);position:relative;overflow:hidden}
.fold:first-child{margin-top:0;margin-inline:6%}
.fold:nth-child(2){margin-inline:2%}
.fold .sw{position:absolute;inset:0}
.show{padding-block:22px 10px;background:var(--paper)}
.show-card{--s-bg:#D8FE47;--s-ink:#111111;--s-line:rgb(17 17 17 / .2);--s-btn:#111111;--s-btn-ink:#D8FE47;
  position:relative;isolation:isolate;border-radius:28px;background:var(--s-bg);color:var(--s-ink);transition:background-color .9s ease,color .9s ease;
  overflow:hidden;display:grid;grid-template-columns:1fr 1.2fr .7fr;gap:24px;padding:clamp(22px,4vw,48px);min-height:620px;box-shadow:0 34px 60px -34px rgb(17 17 17 / .55)}
.show-card::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 65% at 52% 48%, rgb(255 255 255 / .32), transparent 70%),linear-gradient(160deg, rgb(255 255 255 / .1), rgb(0 0 0 / .14));pointer-events:none}
.show-left,.show-right{display:flex;flex-direction:column;min-width:0;position:relative;z-index:2}
.arrows{display:flex;gap:8px;margin-bottom:28px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1px solid var(--s-line);background:transparent;color:var(--s-ink);cursor:pointer;font-size:1rem;transition:background .2s,color .2s}
.arrows button:hover{background:var(--s-ink);color:var(--s-bg)}
.kicker{margin-top:auto;font-size:.76rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;opacity:.75}
.show h1{color:var(--s-ink);font-size:clamp(2.5rem,5.4vw,4.4rem);margin-top:10px;transition:color .9s}
.show p{font-size:1rem;opacity:.82;max-width:36ch;margin:16px 0 22px}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--s-btn);color:var(--s-btn-ink);border:0;border-radius:999px;padding:.8rem 1.4rem;font:600 .95rem var(--sans);cursor:pointer;transition:transform .2s,background .9s,color .9s}
.cta:hover{transform:translateX(3px)}
.socials{display:flex;gap:16px;margin-top:auto;padding-top:28px;font-size:.85rem;font-weight:500}
.socials a{text-decoration:none;opacity:.8}
.socials a:hover{opacity:1;text-decoration:underline}
.stage{position:relative;display:grid;grid-template-rows:1fr auto;align-items:center;min-height:380px;z-index:1}
.obj-wrap{position:relative;height:100%;min-height:340px;display:grid;place-items:center}
.obj{position:relative;width:min(100%,340px);height:340px;animation:objIn .8s cubic-bezier(.2,.8,.2,1) both}
.obj.out{animation:objOut .45s ease-in both}
@keyframes objIn{from{transform:translateX(calc(var(--dir,1) * 45%)) rotate(calc(var(--dir,1) * 14deg)) scale(.85);opacity:0}}
@keyframes objOut{to{transform:translateX(calc(var(--dir,1) * -45%)) rotate(calc(var(--dir,1) * -14deg)) scale(.85);opacity:0}}
.float{position:absolute;inset:0;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
.ground{position:absolute;left:50%;bottom:-6px;width:62%;height:22px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side, rgb(0 0 0 / .38), transparent);animation:ground 5s ease-in-out infinite}
@keyframes ground{50%{transform:translateX(-50%) scale(.82);opacity:.7}}
.garment{position:absolute;inset:0 6% 18px;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;filter:drop-shadow(0 18px 24px rgb(0 0 0 / .25))}
.garment .sw,.garment .shade{position:absolute;inset:0}
.garment .shade{background:linear-gradient(90deg, rgb(0 0 0 / .26), transparent 26%, rgb(255 255 255 / .12) 50%, transparent 74%, rgb(0 0 0 / .28)),linear-gradient(to bottom, rgb(255 255 255 / .1), rgb(0 0 0 / .18))}
.seams{position:absolute;inset:0 6% 18px;width:88%;height:calc(100% - 18px);fill:none;stroke:rgb(0 0 0 / .35);stroke-width:1.6;stroke-linecap:round}
.obj .stack{left:6%;right:6%;bottom:22px}
.obj .fold{height:70px;border-radius:18px;margin-top:-18px;box-shadow:0 10px 18px rgb(0 0 0 / .22)}
.obj .fold::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgb(255 255 255 / .22), transparent 40%, rgb(0 0 0 / .18))}
.tagline{text-align:center;font:italic 500 1.35rem/1.15 var(--serif);margin-top:12px;opacity:.9}
.show-right{align-items:flex-end;text-align:right}
.price-now{font:500 clamp(2.4rem,4vw,3.2rem)/1 var(--serif);font-variant-numeric:tabular-nums}
.price-old{font:500 1.5rem/1.2 var(--serif);text-decoration:line-through;opacity:.55;font-variant-numeric:tabular-nums}
.inst{font-size:.8rem;opacity:.75;margin-top:4px}
.size-label{margin-top:28px;font-size:.85rem;font-weight:500}
.sizes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:10px;max-width:240px}
.size{min-width:46px;height:46px;padding:0 12px;border-radius:999px;border:1px solid var(--s-line);background:rgb(0 0 0 / .08);color:var(--s-ink);font:600 .8rem var(--sans);cursor:pointer;transition:background .2s,color .2s}
.size[aria-pressed="true"]{background:var(--s-ink);color:var(--s-bg);border-color:var(--s-ink)}
.next{margin-top:auto;background:none;border:0;padding:0;color:var(--s-ink);cursor:pointer;display:grid;justify-items:end;gap:6px;font:500 .78rem var(--sans)}
.next .thumb{position:relative;width:96px;height:96px;border-radius:18px;overflow:hidden;background:rgb(0 0 0 / .1);transition:transform .3s}
.next:hover .thumb{transform:translateY(-3px) rotate(-3deg)}
.next .thumb .obj{width:100%;height:100%;animation:none}
.next .thumb .obj .fold{height:22px;border-radius:6px;margin-top:-6px;box-shadow:0 3px 6px rgb(0 0 0 / .2)}
.next .thumb .obj .stack{bottom:10px}
.next .thumb .garment,.next .thumb .seams{inset:10% 10% 10%;width:80%;height:80%}
.bars{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;z-index:3}

      <label class="pf"><span>Usuário</span><input id="lgUser" autocomplete="username"></label>
      <label class="pf"><span>Senha</span><input id="lgPass" type="password" autocomplete="current-password"></label>
      <button class="btn btn-lime" id="lgGo" type="submit">Entrar</button>
      <p id="lgMsg" class="${msg ? "erro" : ""}">${msg ? esc(msg) : ""}</p>
    </form>`;
  $("lgForm").onsubmit = entrar;
  setTimeout(() => $("lgUser").focus(), 0);
}
function semConfig(falta){
  $("painel").classList.add("travado");
  $("pLogin").innerHTML = `<form><div class="brand"><span class="logo-tile"><i class="mark"></i></span><b>Painel da loja</b></div>
    <h2>Falta configurar</h2>
    <p class="p-aviso">Cadastre na Vercel (Settings → Environment Variables) estes itens e publique de novo: <b>${falta.map(esc).join(", ")}</b>.</p></form>`;
}
async function entrar(e){
  e.preventDefault();
  const erro = t => { $("lgMsg").textContent = t; $("lgMsg").className = "erro"; };
  const usuario = $("lgUser").value.trim(), senha = $("lgPass").value;
  if (!usuario || !senha) return erro("Preencha usuário e senha.");
  $("lgGo").disabled = true; $("lgMsg").className = ""; $("lgMsg").textContent = "Entrando…";
  try { await api("login", {usuario, senha}); await abrir(); }
  catch (j) { erro(j.erro === "senha" ? "Usuário ou senha incorretos." : j.erro === "config" ? "O painel ainda não foi configurado na Vercel." : "Não deu para entrar agora. Tente de novo."); }
  finally { const b = $("lgGo"); if (b) b.disabled = false; }
}
async function abrir(){
  const j = await api("dados");
  D = j.dados; sha = j.sha; D.pecas = D.pecas || []; D.loja = D.loja || {};
  $("painel").classList.remove("travado"); setDirty(false); renderPainel();
}
$("pSair").onclick = async () => {
  if (dirty && !confirm("Você tem mudanças não salvas. Sair mesmo assim?")) return;
  await fetch("/api/sair", {method:"POST"}).catch(() => {}); setDirty(false); D = null; travar();
};

/* ---------- Edição ---------- */
function setDirty(v){ dirty = v; $("pStatus").textContent = v ? "Alterações não salvas" : "Tudo salvo"; $("pStatus").classList.toggle("warn", v); }
const field = (id, label, value, opts={}) => opts.area
  ? `<label class="pf"><span>${label}</span><textarea id="${id}" rows="${opts.rows||3}">${esc(value)}</textarea>${opts.hint ? `<small>${opts.hint}</small>` : ""}</label>`
  : `<label class="pf"><span>${label}</span><input id="${id}" type="text" value="${esc(value)}" ${opts.ph ? `placeholder="${esc(opts.ph)}"` : ""}>${opts.hint ? `<small>${opts.hint}</small>` : ""}</label>`;

function renderPainel(){
  $("tabPecas").setAttribute("aria-selected", tab === "pecas");
  $("tabLoja").setAttribute("aria-selected", tab === "loja");
  if (tab === "loja") return renderLojaForm();
  if (editing) return renderPecaForm();
  pBody.innerHTML = `
    <button class="btn btn-lime p-new" id="pNew">+ Nova peça</button>
    <ul class="p-list">${D.pecas.map((p,i) => `
      <li>
        <div class="p-thumb">${photo(p.img, p.name)}</div>
        <div class="p-info"><b>${esc(p.name)}</b><small>${esc(p.cat)} · ${esc(priceOf(p))}${p.vitrine ? " · na vitrine do topo" : ""}</small></div>
        <div class="p-acts">
          <button data-act="up" data-i="${i}" aria-label="Subir" ${i===0?"disabled":""}>↑</button>
          <button data-act="down" data-i="${i}" aria-label="Descer" ${i===D.pecas.length-1?"disabled":""}>↓</button>
          <button data-act="edit" data-i="${i}">Editar</button>
          <button data-act="del" data-i="${i}" class="${confirmDel===i?"danger":""}">${confirmDel===i?"Confirmar":"Excluir"}</button>
        </div>
      </li>`).join("")}</ul>`;
}
function renderPecaForm(){
  const p = editing;
  const deps = [...new Set([...(D.departamentos||[]), p.cat].filter(Boolean))];
  pBody.innerHTML = `
    <button class="p-back" id="pBack">← Voltar para a lista</button>
    <div class="p-photo">
      <div class="p-thumb big">${photo(p.img, p.name)}</div>
      <div><label class="btn btn-line p-upload">Trocar foto<input type="file" id="pFile" accept="image/jpeg,image/png,image/webp" hidden></label>
      <small id="pUpMsg">Use uma foto em pé (vertical), de preferência.</small></div>
    </div>
    ${field("fName","Nome da peça",p.name)}
    <label class="pf"><span>Departamento</span><select id="fCat">${deps.map(d => `<option ${d===p.cat?"selected":""}>${esc(d)}</option>`).join("")}</select></label>
    ${field("fSpec","Descrição curta",p.spec)}
    ${field("fPrice","Preço",p.price,{ph:"Ex.: R$ 189,90", hint:"Deixe vazio para mostrar “Sob consulta”."})}
    ${field("fSizes","Tamanhos",p.sizes,{ph:"P, M, G, GG", hint:"Separe por vírgula."})}
    ${field("fTag","Selo na foto",p.tag,{ph:"Ex.: Nova coleção"})}
    <fieldset class="p-set"><legend>Vitrine animada do topo</legend>
      <label class="p-check"><input type="checkbox" id="fVit" ${p.vitrine?"checked":""}> Mostrar esta peça na vitrine do topo</label>
      ${field("fVt","Título grande",p.vt,{ph:p.name})}
      ${field("fVx","Texto curto",p.vx,{area:true,rows:2})}
      ${field("fVf","Frase embaixo da foto",p.vf)}
      <label class="pf"><span>Cor de fundo</span><select id="fCor">${Object.entries(CORES).map(([k,n]) => `<option value="${k}" ${k===p.cor?"selected":""}>${n}</option>`).join("")}</select></label>
    </fieldset>`;
}
function renderLojaForm(){
  const L = D.loja;
  pBody.innerHTML = `
    ${field("lFaixa","Faixa preta do topo",L.faixa)}
    <fieldset class="p-set"><legend>WhatsApp</legend>
      <small>O primeiro número recebe as listas de pedido. Use 55 + DDD + número. Deixe vazio para esconder.</small>
      ${(L.contatos||[]).map((c,i) => `<div class="p-row">${field("lCn"+i,"Nome "+(i+1),c.label)}${field("lCv"+i,"Número "+(i+1),c.num,{ph:"5562999999999"})}</div>`).join("")}
    </fieldset>
    <fieldset class="p-set"><legend>Endereço e redes</legend>
      ${field("lE1","Endereço, linha 1",L.endereco1)}
      ${field("lE2","Endereço, linha 2",L.endereco2)}
      ${field("lIg","Link do Instagram",L.instagram)}
      ${field("lIgN","Nome do Instagram",L.instagramNome)}
      ${field("lIgC","Chamada da seção do Instagram",L.instagramChamada)}
      ${field("lFb","Link do Facebook",L.facebook)}
    </fieldset>
    <fieldset class="p-set"><legend>A loja</legend>
      ${field("lSt","Título",L.sobreTitulo)}
      ${field("lSd","Palavra em itálico",L.sobreDestaque)}
      ${field("lSx","Texto",L.sobreTexto,{area:true,rows:4})}
    </fieldset>
    <fieldset class="p-set"><legend>Números da loja</legend>
      ${(L.numeros||[]).map((n,i) => `<div class="p-row">${field("lNv"+i,"Número "+(i+1),n.v)}${field("lNt"+i,"Legenda "+(i+1),n.t)}</div>`).join("")}
    </fieldset>
    <fieldset class="p-set"><legend>Departamentos</legend>
      ${field("lDeps","Departamentos, na ordem dos arcos",(D.departamentos||[]).join(", "),{area:true,rows:3,hint:"Separe por vírgula. O arco usa a foto da primeira peça do departamento."})}
    </fieldset>
    <fieldset class="p-set"><legend>Usuário e senha</legend>
      <small>Para trocar, mude ADMIN_USER e ADMIN_PASSWORD na Vercel (Settings → Environment Variables) e publique de novo.</small>
    </fieldset>`;
}
pBody.addEventListener("input", e => {
  const t = e.target, v = t.type === "checkbox" ? t.checked : t.value;
  if (tab === "pecas" && editing) {
    const map = {fName:"name", fCat:"cat", fSpec:"spec", fPrice:"price", fSizes:"sizes", fTag:"tag", fVit:"vitrine", fVt:"vt", fVx:"vx", fVf:"vf", fCor:"cor"};
    if (map[t.id]) { editing[map[t.id]] = v; setDirty(true); }
    return;
  }
  if (tab === "loja") {
    const L = D.loja, m = t.id.match(/^(lCn|lCv|lNv|lNt)(\d)$/);
    if (m) { const i = +m[2]; if (m[1]==="lCn") L.contatos[i].label = v; if (m[1]==="lCv") L.contatos[i].num = digits(v); if (m[1]==="lNv") L.numeros[i].v = v; if (m[1]==="lNt") L.numeros[i].t = v; }
    const map = {lFaixa:"faixa", lE1:"endereco1", lE2:"endereco2", lIg:"instagram", lIgN:"instagramNome", lIgC:"instagramChamada", lFb:"facebook", lSt:"sobreTitulo", lSd:"sobreDestaque", lSx:"sobreTexto"};
    if (map[t.id]) L[map[t.id]] = v;
    if (t.id === "lDeps") D.departamentos = v.split(",").map(s => s.trim()).filter(Boolean);
    setDirty(true);
  }
});

// Reduz a foto no navegador (até 1600 px, JPEG) para caber no envio.
function reduzir(file){
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : falha(new Error("canvas")), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error("imagem")); };
    img.src = url;
  });
}
const paraBase64 = blob => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(blob); });
pBody.addEventListener("change", async e => {
  if (e.target.id !== "pFile" || !e.target.files[0] || !editing) return;
  const alvo = editing;
  $("pUpMsg").textContent = "Enviando foto…";
  try {
    const blob = await reduzir(e.target.files[0]);
    const j = await api("foto", {tipo:"image/jpeg", base64: await paraBase64(blob)});
    previas[j.caminho] = URL.createObjectURL(blob);
    alvo.img = j.caminho; setDirty(true);
    if (editing === alvo) { renderPecaForm(); $("pUpMsg").textContent = "Foto enviada. Toque em Salvar no site para usar."; }
  } catch (j) {
    if ($("pUpMsg")) $("pUpMsg").textContent = j && j.erro ? msgErro(j) : "Não deu para abrir essa foto. Use JPG, PNG ou WEBP.";
  }
});
pBody.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "pNew") {
    editing = {id:"p" + Date.now().toString(36), name:"Nova peça", cat:(D.departamentos||[])[0]||"", spec:"", img:"", tag:"", price:"", sizes:"P, M, G, GG", vitrine:false, vt:"", vx:"", vf:"", cor:"limao"};
    D.pecas.unshift(editing); setDirty(true); renderPainel(); return;
  }
  if (b.id === "pBack") { editing = null; renderPainel(); return; }
  const i = +b.dataset.i, act = b.dataset.act; if (!act) return;
  if (act === "edit") { editing = D.pecas[i]; confirmDel = null; renderPainel(); window.scrollTo(0, 0); return; }
  if (act === "up" || act === "down") { const j = act === "up" ? i - 1 : i + 1; [D.pecas[i], D.pecas[j]] = [D.pecas[j], D.pecas[i]]; confirmDel = null; setDirty(true); renderPainel(); return; }
  if (act === "del") { if (confirmDel === i) { D.pecas.splice(i, 1); confirmDel = null; setDirty(true); } else confirmDel = i; renderPainel(); }
});
$("tabPecas").onclick = () => { tab = "pecas"; renderPainel(); };
$("tabLoja").onclick = () => { tab = "loja"; editing = null; renderPainel(); };
$("pSave").onclick = async () => {
  if (saving || !D) return;
  saving = true; $("pSave").disabled = true; $("pMsg").textContent = "Salvando…";
  try {
    const j = await api("dados", {dados: D, sha});
    sha = j.sha; setDirty(false);
    $("pMsg").textContent = "Salvo! O site atualiza sozinho em cerca de 1 minuto.";
    toast("Site salvo");
  } catch (j) {
    $("pMsg").textContent = msgErro(j);
  } finally {
    saving = false; $("pSave").disabled = false;
  }
};
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

fetch("/api/sessao", {cache:"no-store"}).then(r => r.json()).then(s => {
  if (s.falta && s.falta.length) return semConfig(s.falta);
  if (s.logado) return abrir().catch(() => travar());
  travar();
}).catch(() => semConfig(["as rotas /api não responderam"]));
</script>
